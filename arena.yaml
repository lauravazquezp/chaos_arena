arena:
  name: "three-tier-web"
  services:
    - id: service-a
      depends_on: [service-b]
    - id: service-b
      depends_on: [service-c]
    - id: service-c
      depends_on: []

game:
  duration_seconds: 60
  auto_attacks:
    - at_second: 10
      service: service-b
      attack: kill_switch
    - at_second: 25
      service: service-c
      attack: latency_spike
    - at_second: 40
      service: service-b
      attack: black_hole
