name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        run: docker compose build

      - name: Push control-plane image
        run: |
          docker tag chaos-arena-control-plane ghcr.io/${{ github.repository }}/control-plane:${{ github.ref_name }}
          docker push ghcr.io/${{ github.repository }}/control-plane:${{ github.ref_name }}
