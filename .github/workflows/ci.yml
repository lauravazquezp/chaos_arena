name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: go mod download
        run: cd control-plane && go mod download
        env:
          GOTOOLCHAIN: auto

      - name: go vet
        run: cd control-plane && go vet ./...
        env:
          GOTOOLCHAIN: auto

      - name: go test
        run: cd control-plane && go test ./...
        env:
          GOTOOLCHAIN: auto

      - name: docker compose build
        run: docker compose build

      - name: smoke test
        run: bash test/smoke.sh
