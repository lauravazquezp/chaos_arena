services:
  control-plane:
    build: ./control-plane
    ports:
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./reports:/app/reports
      - ./arena.yaml:/app/arena.yaml
    environment:
      - ARENA_CONFIG=/app/arena.yaml
      - REPORTS_DIR=/app/reports

  api-gateway:
    build: ./arena-service
    cap_add: [NET_ADMIN]
    environment:
      - SERVICE_NAME=api-gateway
      - UPSTREAM_URL=http://auth-service:3000

  auth-service:
    build: ./arena-service
    cap_add: [NET_ADMIN]
    environment:
      - SERVICE_NAME=auth-service
      - UPSTREAM_URL=http://payments:3000

  payments:
    build: ./arena-service
    cap_add: [NET_ADMIN]
    environment:
      - SERVICE_NAME=payments
      - UPSTREAM_URL=""

  cache:
    build: ./arena-service
    cap_add: [NET_ADMIN]
    environment:
      - SERVICE_NAME=cache
      - UPSTREAM_URL=""

  worker:
    build: ./arena-service
    cap_add: [NET_ADMIN]
    environment:
      - SERVICE_NAME=worker
      - UPSTREAM_URL=""

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      - VITE_WS_URL=ws://localhost:8080/ws
      - VITE_API_URL=http://localhost:8080
